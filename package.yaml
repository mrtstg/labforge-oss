name:                proxmox-compose
version:             0.1.0.0
github:              "mrtstg/proxmox-compose"
license:             BSD-3-Clause
author:              "Ilya Zamaratskikh"
maintainer:          "mrtstgdev@gmail.com"
copyright:           "2025 Ilya Zamaratskikh"

extra-source-files:
- README.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

description:         Please see the README on GitHub at <https://github.com/mrtstg/proxmox-compose#readme>

dependencies:
- base >= 4.7 && < 5
- servant == 0.19.1

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  proxmox-compose-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - proxmox-compose

tests:
  proxmox-compose-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - proxmox-compose
