name:                proxmox-fs-agent
version:             0.1.0.0
github:              "learnew2/proxmox-fs-agent"
license:             BSD-3-Clause
author:              "Ilya Zamaratskikh"
maintainer:          "mrtstg@yandex.ru"
copyright:           "2025 Ilya Zamaratskikh"

description:         Please see the README on GitHub at <https://github.com/learnew2/proxmox-fs-agent#readme>

dependencies:
- base >= 4.7 && < 5
- aeson == 2.1.2.1
- yesod-core == 1.6.24.5
- optparse-applicative == 0.17.1.0
- load-env == 0.2.1.0
- text ^>= 2
- directory == 1.3.7.1
- filepath == 1.4.2.2
- http-types == 0.12.3
- bytestring == 0.11.5.2
- strict == 0.5
- containers == 0.6.7
- attoparsec == 0.14.4
- warp == 3.3.25
- warp-tls == 3.3.6

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  proxmox-fs-agent-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - proxmox-fs-agent

tests:
  proxmox-fs-agent-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - proxmox-fs-agent
    - hspec >= 2.0.0
    - hspec-discover
