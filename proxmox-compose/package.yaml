name:                proxmox-compose
version:             0.1.0.0
github:              "learnew2/proxmox-compose"
license:             BSD-3-Clause
author:              "Ilya Zamaratskikh"
maintainer:          "mrtstg@yandex.ru"
copyright:           "2025 Ilya Zamaratskikh"

extra-source-files:
- README.md

description:         Please see the README on GitHub at <https://github.com/learnew2/proxmox-compose#readme>

dependencies:
- base >= 4.7 && < 5
- servant == 0.19.1
- text == 2.0.2
- aeson == 2.1.2.1
- http-client == 0.7.14
- servant-client == 0.19
- connection == 0.3.1
- http-conduit == 2.3.8.1
- transformers == 0.5.6.2
- optparse-applicative == 0.17.1.0
- yaml == 0.11.11.2
- directory == 1.3.7.1
- hslogger == 1.3.1.0
- containers == 0.6.7
- case-insensitive == 1.2.1.0
- bytestring == 0.11.5.2
- filepath == 1.4.2.2
- mtl == 2.2.2
- http-types == 0.12.3
- monad-logger == 0.3.40
- proxmox-fs-agent-api
- proxmox-api
- proxmox-deploy-toolkit

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  proxmox-compose:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -optl=-static
    dependencies:
    - proxmox-compose

tests:
  proxmox-compose-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - proxmox-compose
    - hspec >= 2.0.0
    - hspec-discover
